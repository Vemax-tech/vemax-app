<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Visão em camadas da VEMAX</title>
  <desc id="d">Como a pessoa entra, onde o sistema roda e o que fica registrado</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8EEF8"/></linearGradient></defs>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .card { fill: #FFFFFF; stroke: #3B82F6; stroke-opacity: .45; stroke-width: 1.5; animation: g 5s ease-in-out infinite; }
    .h { font-size: 15px; font-weight: 700; letter-spacing: 3px; fill: #0A101C; }
    .l1 { font-size: 17px; font-weight: 600; fill: #0A101C; }
    .l2 { font-size: 13.5px; fill: #4A5670; }
    @keyframes g { 0%,100% { stroke-opacity: .35 } 50% { stroke-opacity: .8 } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none } }
  </style>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <text x="640" y="42" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="6" fill="#2563EB">VEMAX · VISÃO EM CAMADAS</text>
  <g transform="translate(40 0)"><rect x="0" y="70" width="380" height="300" rx="16" class="card"/><text x="24" y="108" class="h">COMO A PESSOA ENTRA</text><rect x="24" y="120" width="40" height="3" rx="1.5" fill="#3B82F6"/><circle cx="32" cy="155" r="4" fill="#5B9DFF"/><text x="48" y="160" class="l1">Visitante abre o site</text><text x="48" y="179" class="l2">index.html, sem login</text><circle cx="32" cy="207" r="4" fill="#5B9DFF"/><text x="48" y="212" class="l1">Descreve o problema</text><text x="48" y="231" class="l2">triagem por palavras-chave (RULES)</text><circle cx="32" cy="259" r="4" fill="#5B9DFF"/><text x="48" y="264" class="l1">Fala com a equipe</text><text x="48" y="283" class="l2">formulário → WhatsApp ou e-mail</text><circle cx="32" cy="311" r="4" fill="#5B9DFF"/><text x="48" y="316" class="l1">Equipe entra em /app/</text><text x="48" y="335" class="l2">cadastro pendente até o admin aprovar</text></g><g transform="translate(460 0)"><rect x="0" y="70" width="380" height="300" rx="16" class="card"/><text x="24" y="108" class="h">ONDE RODA</text><rect x="24" y="120" width="40" height="3" rx="1.5" fill="#3B82F6"/><circle cx="32" cy="155" r="4" fill="#5B9DFF"/><text x="48" y="160" class="l1">Front estático</text><text x="48" y="179" class="l2">HTML, CSS e JS ES modules, sem build</text><circle cx="32" cy="207" r="4" fill="#5B9DFF"/><text x="48" y="212" class="l1">supabase-js (versão fixa)</text><text x="48" y="231" class="l2">carregado via CDN jsDelivr</text><circle cx="32" cy="259" r="4" fill="#5B9DFF"/><text x="48" y="264" class="l1">Supabase</text><text x="48" y="283" class="l2">Auth + Postgres com RLS + Storage</text><circle cx="32" cy="311" r="4" fill="#5B9DFF"/><text x="48" y="316" class="l1">Edge Function (Deno)</text><text x="48" y="335" class="l2">notificar-email avisa por e-mail</text></g><g transform="translate(880 0)"><rect x="0" y="70" width="380" height="300" rx="16" class="card"/><text x="24" y="108" class="h">O QUE FICA REGISTRADO</text><rect x="24" y="120" width="40" height="3" rx="1.5" fill="#3B82F6"/><circle cx="32" cy="155" r="4" fill="#5B9DFF"/><text x="48" y="160" class="l1">contatos_site</text><text x="48" y="179" class="l2">leads enviados pelo formulário</text><circle cx="32" cy="207" r="4" fill="#5B9DFF"/><text x="48" y="212" class="l1">atividades</text><text x="48" y="231" class="l2">quem fez o quê, gravado por trigger</text><circle cx="32" cy="259" r="4" fill="#5B9DFF"/><text x="48" y="264" class="l1">projetos, nichos, pesquisas</text><text x="48" y="283" class="l2">e a base de conhecimento</text><circle cx="32" cy="311" r="4" fill="#5B9DFF"/><text x="48" y="316" class="l1">portfolio_cases</text><text x="48" y="335" class="l2">e 3 buckets de arquivos</text></g>
</svg>
