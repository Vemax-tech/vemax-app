name: Testes

# Roda quando código, testes ou migrations mudam. Sem segredos e sem deploy.
on:
  push:
    branches: [main]
    paths: ['app/**', 'assets/**', 'tests/**', 'scripts/**', 'supabase/**', '_headers', '*.html', 'package.json', '.github/workflows/testes.yml']
  pull_request:
    branches: [main]
    paths: ['app/**', 'assets/**', 'tests/**', 'scripts/**', 'supabase/**', '_headers', '*.html', 'package.json', '.github/workflows/testes.yml']

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e verificação estática
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificação estática (sintaxe, imports, CSP, sem script embutido, migrations)
        run: npm run check
      - name: Testes unitários (regras de negócio, validações, sessão, cabeçalhos)
        run: npm test

  integracao:
    name: Banco e telas (integração)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/integration/package-lock.json
      - name: Instalar dependências de teste (isoladas em tests/integration)
        run: npm ci --prefix tests/integration
      - name: Segurança do banco (RLS, sessão, 2FA, eventos, injeção de SQL)
        run: node tests/integration/sql-seguranca.mjs
      - name: Regras do banco (funil, financeiro, contratos, lixeira, auditoria)
        run: node tests/integration/sql-funcional.mjs
      - name: Telas, login e sessão (navegador simulado)
        run: node tests/integration/telas.mjs
