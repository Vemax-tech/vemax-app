name: Qualidade

# Leve de propósito: roda só quando docs ou o próprio workflow mudam,
# porque em repositório privado o Actions consome minutos do plano gratuito.
on:
  push:
    branches: [main]
    paths: ['**.md', 'docs/assets/**', '.github/workflows/qualidade.yml']
  pull_request:
    branches: [main]
    paths: ['**.md', 'docs/assets/**', '.github/workflows/qualidade.yml']

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Links dos .md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verificar links quebrados
        uses: lycheeverse/lychee-action@v2
        with:
          # O repositório é privado: links para ele não são acessíveis sem login.
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            --exclude '^https://github\.com/Vemax-tech/'
            --exclude 'users\.noreply\.github\.com'
            --exclude '\.supabase\.co'
            './**/*.md'
          fail: true

  svgs:
    name: SVGs válidos
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Validar SVGs de docs/assets como XML
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom
          erros = 0
          arquivos = sorted(glob.glob('docs/assets/**/*.svg', recursive=True))
          for f in arquivos:
              try:
                  xml.dom.minidom.parse(f)
                  print('ok  ', f)
              except Exception as e:
                  erros += 1
                  print('ERRO', f, e)
          if not arquivos:
              sys.exit('nenhum SVG encontrado em docs/assets')
          sys.exit(1 if erros else 0)
          PY
